<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" class="w-full h-full">
            <defs>
              <!-- Sun Gradients -->
              <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#FFD000" stop-opacity="1"></stop>
                <stop offset="100%" stop-color="#FF9100" stop-opacity="1"></stop>
              </radialGradient>
              
              <linearGradient id="sunGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#FFE500"></stop>
                <stop offset="100%" stop-color="#FF6D00"></stop>
              </linearGradient>

              <!-- Cloud Gradients -->
              <linearGradient id="cloudFront" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#FFFFFF"></stop>
                <stop offset="60%" stop-color="#E2E8F0"></stop>
                <stop offset="100%" stop-color="#CBD5E1"></stop>
              </linearGradient>

              <linearGradient id="cloudBack" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#93C5FD"></stop>
                <stop offset="100%" stop-color="#3B82F6"></stop>
              </linearGradient>

              <!-- Drop Shadows -->
              <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.3"></feDropShadow>
              </filter>

              <filter id="cloudShadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1E293B" flood-opacity="0.25"></feDropShadow>
              </filter>
            </defs>

            <!-- Background Glow Circle for Crisp Display -->
            <circle cx="256" cy="256" r="230" fill="#0f172a" fill-opacity="0.01"></circle>

            <!-- SUN GROUP -->
            <g id="sun" filter="url(#softShadow)">
              <!-- Sun Rays -->
              <g stroke="url(#sunGradient)" stroke-width="18" stroke-linecap="round" opacity="0.95">
                <line x1="200" y1="90" x2="200" y2="55"></line>
                <line x1="280" y1="123" x2="305" y2="92"></line>
                <line x1="120" y1="170" x2="88" y2="145"></line>
                <line x1="320" y1="210" x2="355" y2="210"></line>
                <line x1="100" y1="260" x2="65" y2="260"></line>
              </g>

              <!-- Main Sun Body -->
              <circle cx="200" cy="200" r="82" fill="url(#sunGradient)"></circle>
              <circle cx="200" cy="200" r="82" fill="url(#sunGlow)" opacity="0.3"></circle>
            </g>

            <!-- BACK ACCENT CLOUD -->
            <path d="M 280 290 
                     A 45 45 0 0 0 350 230 
                     A 40 40 0 0 0 310 170 
                     A 55 55 0 0 0 220 185 
                     A 45 45 0 0 0 175 220
                     Z" fill="url(#cloudBack)" opacity="0.75"></path>

            <!-- MAIN FRONT CLOUD -->
            <path d="M 160 380
                     L 360 380
                     A 50 50 0 0 0 360 280
                     A 45 45 0 0 0 315 235
                     A 75 75 0 0 0 175 260
                     A 55 55 0 0 0 110 325
                     A 55 55 0 0 0 160 380 Z" fill="url(#cloudFront)" filter="url(#cloudShadow)"></path>

            <!-- HIGHLIGHT ON CLOUD TOP -->
            <path d="M 180 263
                     A 70 70 0 0 1 310 240
                     A 40 40 0 0 1 352 282
                     A 72 72 0 0 0 180 263 Z" fill="#FFFFFF" opacity="0.6"></path>
          </svg>