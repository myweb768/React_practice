<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Todo App</title>

    <!-- SEO -->
    <meta
      name="description"
      content="A simple, fast todo app to plan your day, track tasks and stay organized."
    />
    <meta name="theme-color" content="#ffffff" />
    <link rel="canonical" href="https://your-domain.com/" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="My Todo App" />
    <meta property="og:title" content="My Todo App" />
    <meta
      property="og:description"
      content="A simple, fast todo app to plan your day, track tasks and stay organized."
    />
    <meta property="og:url" content="https://your-domain.com/" />
    <meta property="og:image" content="https://your-domain.com/og-image.png" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="My Todo App" />
    <meta
      name="twitter:description"
      content="A simple, fast todo app to plan your day, track tasks and stay organized."
    />
    <meta name="twitter:image" content="https://your-domain.com/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
